name: Build Keyman Keyboard

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Keyman Compiler
        run: npm install -g @keymanapp/kmc

      - name: Build KMP Package
        run: kmc build ThaiKeyboardRulesForManoonchaiX.kmn

      - name: Upload KMP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManoonchaiX-kmp
          path: "*.kmp"
