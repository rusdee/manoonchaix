name: Build Keyman Keyboard

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Keyman Compiler
        run: npm install -g @keymanapp/kmc

      - name: Build Keyboard
        run: |
          KMN_FILE=$(ls *.kmn | head -n 1)
          echo "Building file: $KMN_FILE"
          kmc build "$KMN_FILE"

      - name: Upload Keyboard Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ManoonchaiX-Keyboard
          path: |
            *.kmx
            *.kmp
            *.js
